<script>
const blocks = ['Primer bloque', 'Segundo bloque', 'Tercer bloque'];
const root = document.getElementById('blocks');
blocks.forEach((text, i) => {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="group/insert relative border-t border-dashed border-transparent hover:border-border focus-within:border-border"><button class="h-6 px-1 text-xs opacity-0 group-hover/insert:opacity-100 focus:opacity-100">+ Insertar</button></div><div class="relative pl-5"><div role="button" tabindex="0">${text}</div></div>`;
  wrap.querySelector('button').addEventListener('click', event => {
    event.currentTarget.parentElement.innerHTML = `<div class="flex flex-wrap gap-2 py-2" data-position="${i}"><span>Elige el tipo de bloque</span><button>Párrafo</button><button>Lista</button></div>`;
    document.body.dataset.inserting = String(i);
  });
  wrap.querySelector('[role=button]').addEventListener('click', () => { document.body.dataset.edited = text; });
  root.append(wrap);
});
const end = document.createElement('div'); end.className = 'mt-3 border-t border-dashed pt-2';
end.innerHTML = '<button>+ Agregar al final</button>'; end.querySelector('button').addEventListener('click', () => { document.body.dataset.inserting = 'end'; end.insertAdjacentHTML('beforeend', '<div><span>Elige el tipo de bloque</span></div>'); });
root.append(end);
</script></body></html>
