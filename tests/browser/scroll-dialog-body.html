<!doctype html><html><head><title>Terms</title><style>
body{margin:0;font:14px sans-serif;overflow:hidden}.dlg{position:fixed;inset:60px 25%;max-height:420px;overflow-y:auto;border:1px solid;background:#fff;padding:16px}
p{margin:0 0 14px}</style></head><body><p id="status" style="padding:20px">Draft not saved</p>
<div id="terms" class="dlg" role="dialog" aria-modal="true" aria-labelledby="h"><h2 id="h">Review terms</h2><div id="body"></div>
<button id="cancel">Cancel</button> <button id="save">Save terms</button></div>
<script>const b=document.getElementById('body');if(new URLSearchParams(location.search).has('inner')){const list=document.createElement('div');list.id='inner';list.setAttribute('aria-label','Inner list');list.style.cssText='height:240px;overflow:auto';for(let i=1;i<=30;i++){const row=document.createElement('p');row.textContent='Inner item '+i;list.append(row)}b.append(list);if(new URLSearchParams(location.search).has('inner-end'))list.scrollTop=list.scrollHeight;}for(let i=1;i<=30;i++){const p=document.createElement('p');p.textContent='Clause '+i+'. The parties agree to the synthetic terms of this fixture, paragraph '+i+'.';b.append(p)}
document.getElementById('save').onclick=()=>{document.getElementById('status').textContent='Terms saved';document.querySelector('.dlg').remove()};
document.getElementById('cancel').onclick=()=>{document.getElementById('status').textContent='Cancelled';document.querySelector('.dlg').remove()};</script></body></html>
