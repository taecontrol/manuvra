<!doctype html><html><head><title>Localities</title><style>
body{margin:0;font:14px sans-serif}.shell{height:100vh;display:flex;flex-direction:column}.bar{height:360px;background:#f4f4f4;padding:16px}
.table{flex:1;min-height:0;overflow:auto}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}
</style></head><body><div class="shell"><div class="bar"><h1>Shipping localities</h1><p id="status">No locality opened</p></div>
<div class="table"><table aria-label="Localities"><tbody id="rows"></tbody></table></div></div>
<script>if(new URLSearchParams(location.search).has('cancel-wheel'))document.addEventListener('wheel',e=>e.preventDefault(),{passive:false});const t=document.getElementById('rows');for(let i=1;i<=60;i++){const tr=document.createElement('tr');tr.innerHTML=`<td>Locality ${i}</td><td>Zone ${(i%5)+1}</td><td><button>Open locality ${i}</button></td>`;tr.querySelector('button').onclick=()=>{document.getElementById('status').textContent='Opened locality '+i};t.append(tr)}</script></body></html>
