name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Rust and analysis tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default 1.95.0
          cargo install cargo-crap --version 0.4.3 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Format
        run: make fmt
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Advisory CRAP inventory
        shell: bash
        run: |
          mkdir -p target
          set +e
          cargo run --locked --manifest-path tools/crap-gate/Cargo.toml -- \
            --repo-root . \
            --rust-manifest Cargo.toml \
            --rust-root crates \
            --report-json target/crap-report.json
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          python3 - <<'PY'
          import json
          import os

          with open("target/crap-report.json", encoding="utf-8") as stream:
              report = json.load(stream)
          entries = report.get("entries")
          if report.get("threshold") != 8 or not isinstance(entries, list):
              raise SystemExit("invalid CRAP report contract")
          offenders = sum(entry["crap"] > report["threshold"] for entry in entries)
          maximum = max((entry["crap"] for entry in entries), default=0)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Advisory CRAP inventory\n")
              summary.write(f"- Functions: {len(entries)}\n")
              summary.write(f"- Above threshold: {offenders}\n")
              summary.write(f"- Maximum: {maximum}\n")
          PY
