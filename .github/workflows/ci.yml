name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust and analysis tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default 1.95.0
          cargo install cargo-crap --version 0.4.3 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Format
        run: make fmt
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Verify macOS source packaging
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          first=$(mktemp -d)
          second=$(mktemp -d)
          scripts/create-source-archive.sh --version "$version" --output "$first"
          scripts/create-source-archive.sh --version "$version" --output "$second"
          cmp "$first/manuvra-$version.tar.gz" "$second/manuvra-$version.tar.gz"

          source_dir=$(mktemp -d)
          prefix=$(mktemp -d)
          tar -xzf "$first/manuvra-$version.tar.gz" -C "$source_dir"
          cargo install --locked --path "$source_dir/manuvra-$version/crates/manuvra-cli" --root "$prefix"
          test "$("$prefix/bin/manuvra" version | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')" = "$version"
          "$prefix/bin/manuvra" schema job | python3 -c 'import json, sys; assert json.load(sys.stdin)["title"] == "Job"'

          archive=$(cd "$first" && pwd -P)/manuvra-$version.tar.gz
          sha=$(awk '{print $1}' "$archive.sha256")
          tap=taecontrol/manuvra-ci
          brew tap-new --no-git "$tap"
          formula="$(brew --repository "$tap")/Formula/manuvra.rb"
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@SHA256@/$sha/g" \
            -e "s|^  url .*|  url \"file://$archive\"|" \
            packaging/manuvra.rb.template > "$formula"
          brew install --build-from-source "$tap/manuvra"
          brew test "$tap/manuvra"
          brew uninstall "$tap/manuvra"
          brew untap "$tap"
      - name: Advisory CRAP inventory
        shell: bash
        run: |
          mkdir -p target
          set +e
          cargo run --locked --manifest-path tools/crap-gate/Cargo.toml -- \
            --repo-root . \
            --rust-manifest Cargo.toml \
            --rust-root crates \
            --platform-profiles tools/crap-gate/platform-profiles.json \
            --report-json target/crap-report.json
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          python3 - <<'PY'
          import json
          import os

          with open("target/crap-report.json", encoding="utf-8") as stream:
              report = json.load(stream)
          entries = report.get("entries")
          if report.get("threshold") != 8 or not isinstance(entries, list):
              raise SystemExit("invalid CRAP report contract")
          offenders = sum(entry["crap"] > report["threshold"] for entry in entries)
          maximum = max((entry["crap"] for entry in entries), default=0)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Advisory CRAP inventory\n")
              summary.write(f"- Functions: {len(entries)}\n")
              summary.write(f"- Above threshold: {offenders}\n")
              summary.write(f"- Maximum: {maximum}\n")
          PY

  linux-distribution:
    name: Linux package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Build and verify the Linux release archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          first=$(mktemp -d)
          second=$(mktemp -d)
          scripts/create-linux-binary-archive.sh --version "$version" --arch "$ARCH" --output "$first"
          scripts/create-linux-binary-archive.sh --version "$version" --arch "$ARCH" --output "$second"

          archive="manuvra-$version-linux-$ARCH.tar.gz"
          cmp "$first/$archive" "$second/$archive"
          (cd "$first" && sha256sum -c "$archive.sha256")
          test "$(tar -tzf "$first/$archive")" = manuvra

          extracted=$(mktemp -d)
          tar -xzf "$first/$archive" -C "$extracted"
          test -x "$extracted/manuvra"
          test "$("$extracted/manuvra" version | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')" = "$version"
          "$extracted/manuvra" schema job | python3 -c 'import json, sys; assert json.load(sys.stdin)["title"] == "Job"'
