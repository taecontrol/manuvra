name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Rust and analysis tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default 1.95.0
          cargo install cargo-crap --version 0.4.3 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Format
        run: make fmt
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: CRAP gate
        run: make crap
