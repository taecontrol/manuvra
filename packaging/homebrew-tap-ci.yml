name: ci

on:
  pull_request:
    paths: [Formula/manuvra.rb]

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit, install, verify, and uninstall
        run: |
          brew tap --custom-remote taecontrol/tap "$GITHUB_WORKSPACE"
          brew trust --formula taecontrol/tap/manuvra
          brew audit --strict --online --tap taecontrol/tap
          brew install --formula taecontrol/tap/manuvra
          test "$(manuvra commands list --limit 1 | wc -c)" -le 4096
          test "$(manuvra daemon status | wc -c)" -le 4096
          codesign --verify --deep --strict --verbose=2 "$(brew --prefix manuvra)/libexec/Manuvra.app"
          manuvra daemon stop
          brew uninstall manuvra
